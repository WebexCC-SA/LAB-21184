---
site_name: "LAB-21184: Using AI and Webex APIs to Develop Custom Tools and Functionality in Webex Contact Center" # This must begin with the session ID, e.g. LABXXX-1234 This is my Cisco Live Lab
site_description: "Using AI and Webex APIs to Develop Custom Tools and Functionality in Webex Contact Center" # must be same as "site_name"
site_author: Kevin Simpson, Barry McLellan
copyright: Copyright &copy; 2026 Cisco
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.integrate
  custom_dir: docs/overrides
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/webexLogo91.png
  favicon: template_assets/webex75.png
extra:
  generator: false
  repo: "https://github.com/WebexCC-SA/LAB-21184.git"
  site_event: test
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - template_assets/js/newLoad.js
  - template_assets/js/setInfo.js
plugins:
  - search
  - macros
  # - with-pdf:
  #     cover_title: LABXXX-1234
  #     cover_subtitle: My famous WebexOne Lab
  #     cover_logo: template_assets/wx1Splash_new.gif
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
      - custom-skip-class-name
      auto_caption: true
      caption_position: top
markdown_extensions:
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
      
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Welcome:
    - Let's Get Started: welcome.md
    # - Overview: overview.md
  - Labs:      
      # - Lab 1 - Getting Started: lab1_getting_started.md
      - Lab 1 Bring Your Own Channel (BYOC): 
        - Overview: lab1_overview.md
        - Creating the Required Configurations: createAppsAndConfigs.md
        - Setting up the Environment: lab1_setup.md
        - Create Your Constitution: createConstitution.md
        - Specify The Features: specifyTheFeatures.md
        - Making a Plan: makeAPlan.md
        - Create Tasks: createTasks.md

      - Conclusion: conclusion.md
  # - Topologies: topologies.md
  - Tools And References: toolsAndReferences.md
  - How to use this guide:
      - Setting up and using the tool:
        - Initial Setup: howToUse/initialSetup.md
        - Using the tool after the initial setup: howToUse/postInitial.md
        - Publishing your changes: howToUse/syncChanges.md
      - Styling and Advanced Features: 
        - Markdown and Other References: howToUse/references.md
        - Custom Features: howToUse/customFeatures.md
        - Custom Admonitions: howToUse/admonition.md
 